        @keyframes floatBall {

            10% { opacity: 0.04; }
            90% { opacity: 0.04; }
            100% { transform: translateY(-20vh) rotate(360deg) scale(1.2); opacity: 0; }
        }
        .bg-ball { position: absolute; color: #ffffff; animation: floatBall linear infinite; opacity: 0; }
        .bg-ball-1 { left: 10%; width: 80px; height: 80px; animation-duration: 25s; animation-delay: 0s; }
        .bg-ball-2 { left: 85%; width: 150px; height: 150px; animation-duration: 35s; animation-delay: -5s; }
        .bg-ball-3 { left: 45%; width: 60px; height: 60px; animation-duration: 22s; animation-delay: -12s; }
        .bg-ball-4 { left: 65%; width: 100px; height: 100px; animation-duration: 28s; animation-delay: -2s; }
        .bg-ball-5 { left: 25%; width: 120px; height: 120px; animation-duration: 32s; animation-delay: -18s; }
        .bg-ball-6 { left: 75%; width: 70px; height: 70px; animation-duration: 26s; animation-delay: -9s; }
        .bg-ball-7 { left: 5%; width: 90px; height: 90px; animation-duration: 30s; animation-delay: -15s; }

        /* 自定義淡入動畫 */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.8s ease-out forwards;
        }

            width: 0px;
            background: transparent;

                    <path d="M 17 17 Q 50 50 17 83 M 83 17 Q 50 50 83 83" />
                </svg>`;
            }
            bgContainer.innerHTML = svgHTML;
        }

        // 隱藏破圖
        function handleImageError(imgElement) {
            console.error('圖片載入失敗，可能是 Google Drive 權限或跨域問題:', imgElement.src);
            imgElement.style.display = 'none'; // 可視需求決定要不要隱藏
        }

        // 生成雷達圖 SVG
        function generateRadarChartSVG(stats, color) {
            const labels = ['破壞力', '射程', '球商', '防守', '體能', '華麗度'];
            const maxVal = 10;
            const size = 300;
            const center = size / 2;
            const radius = 100;

            const getPoint = (value, index, count) => {
                const angle = (Math.PI * 2 * index) / count - Math.PI / 2;
                const r = (value / maxVal) * radius;
                return { x: center + r * Math.cos(angle), y: center + r * Math.sin(angle) };
            };

            const points = stats.map((val, i) => getPoint(val, i, 6));
            const pointsStr = points.map(p => `${p.x},${p.y}`).join(' ');

            let gridsHTML = '';
            [10, 6.6, 3.3].forEach((val, idx) => {
                const pts = Array.from({length: 6}, (_, i) => getPoint(val, i, 6));
                const ptsStr = pts.map(p => `${p.x},${p.y}`).join(' ');
                gridsHTML += `<polygon points="${ptsStr}" fill="none" stroke="#374151" stroke-width="1" stroke-dasharray="${idx === 0 ? '' : '2 2'}"></polygon>`;
            });

            let axisHTML = '';
            for(let i=0; i<6; i++) {
                const outerPoint = getPoint(10, i, 6);
                axisHTML += `<line x1="${center}" y1="${center}" x2="${outerPoint.x}" y2="${outerPoint.y}" stroke="#374151" stroke-width="1"></line>`;
            }

            let pointsDotsHTML = '';
            points.forEach(p => {
                pointsDotsHTML += `<circle cx="${p.x}" cy="${p.y}" r="4" fill="#000" stroke="${color}" stroke-width="2"></circle>`;
            });

            let labelsHTML = '';
            labels.forEach((label, i) => {
                const lblPoint = getPoint(12.5, i, 6);
                labelsHTML += `<text x="${lblPoint.x}" y="${lblPoint.y}" fill="#9CA3AF" font-size="12" font-weight="bold" text-anchor="middle" dominant-baseline="middle">${label}</text>`;
            });

            return `
            <div class="relative w-full max-w-[340px] mx-auto">
                <svg viewBox="0 0 ${size} ${size}" class="w-full h-auto drop-shadow-xl">
                    ${gridsHTML}
                    ${axisHTML}
                    <polygon points="${pointsStr}" fill="${color}" fill-opacity="0.15" stroke="${color}" stroke-width="2" stroke-linejoin="round"></polygon>
                    ${pointsDotsHTML}
                    ${labelsHTML}
                </svg>
            </div>`;
        }

        // 生成抽象頭像 SVG (如果沒有圖片時的備用)
        function generatePlayerAvatarSVG(colors) {
            return `
            <svg viewBox="0 0 200 200" class="w-48 h-48 mx-auto drop-shadow-2xl mb-6">
                <defs>
                    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="${colors[0]}" />
                        <stop offset="100%" stop-color="${colors[1]}" />
                    </linearGradient>
                    <filter id="glow">
                        <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
                        <feMerge>
                            <feMergeNode in="coloredBlur"/>
                            <feMergeNode in="SourceGraphic"/>
                        </feMerge>
                    </filter>
                </defs>
                <circle cx="100" cy="100" r="95" fill="url(#bgGrad)" opacity="0.05" />
                <circle cx="100" cy="100" r="85" fill="none" stroke="url(#bgGrad)" stroke-width="1" stroke-dasharray="2 4" opacity="0.5" />
                <g transform="translate(0, 10)">
                    <path d="M 60 180 Q 60 110 100 110 Q 140 110 140 180 Z" fill="${colors[0]}" opacity="0.9" />
                    <path d="M 75 180 L 75 115 M 125 180 L 125 115" stroke="${colors[1]}" stroke-width="2" opacity="0.5" />
                    <rect x="92" y="90" width="16" height="25" fill="#3F3F46" />
                    <circle cx="100" cy="70" r="28" fill="#D4D4D8" />
                    <rect x="72" y="52" width="56" height="8" fill="${colors[1]}" opacity="0.8" />
                    <rect x="84" y="65" width="32" height="6" rx="3" fill="#18181B" />
                    <circle cx="150" cy="130" r="16" fill="#FFFFFF" filter="url(#glow)" opacity="0.9" />
                    <path d="M 134 130 Q 150 114 166 130 M 150 114 L 150 146" stroke="#18181B" stroke-width="1.5" fill="none" />
                </g>
            </svg>`;
        }


        // --- 畫面渲染邏輯區 ---
        
        const appRoot = document.getElementById('app-root');

        function updateUI() {
            if (stage === 'start') {
                renderStart();
            } else if (stage === 'playing') {
                renderPlaying();
            } else if (stage === 'analyzing') {
                renderAnalyzing();
            } else if (stage === 'result') {
                renderResult();
            }
            
            // 重新渲染 Lucide 圖標
            lucide.createIcons();
        }

        function renderStart() {
            appRoot.innerHTML = `
                <div class="flex flex-col items-center justify-center p-6 h-screen">
                    <div class="max-w-md w-full text-center space-y-8 animate-fade-in-up">
                        <div class="w-24 h-24 bg-white rounded-full mx-auto flex items-center justify-center shadow-[0_0_40px_rgba(255,255,255,0.15)]">
                            <i data-lucide="trophy" class="w-12 h-12 text-black"></i>
                        </div>
                        <div>
                            <h1 class="text-4xl font-extrabold tracking-tight mb-3">NBA 籃球靈魂測驗</h1>
                            <p class="text-neutral-400 text-lg">
                                這不是測驗你的實力，而是測驗你的籃球品味。憑直覺選出你內心覺得「最帥」的樣子，找出你在 NBA 的靈魂模板！
                            </p>
                        </div>
                        <button onclick="handleStart()" class="w-full py-4 bg-white hover:bg-zinc-200 text-black font-bold rounded-xl text-lg flex items-center justify-center gap-2 transition-all active:scale-95 shadow-lg shadow-white/10">
                            <i data-lucide="play" class="w-5 h-5 fill-current"></i>
                            開始尋找靈魂
                        </button>
                    </div>
                </div>
            `;
        }

        function renderPlaying() {
            const currentQ = questions[currentQIndex];
            const progress = ((currentQIndex) / questions.length) * 100;

            let optionsHTML = currentQ.options.map((opt, i) => `
                <button onclick="handleAnswer(${currentQIndex}, ${i})" class="w-full text-left p-5 rounded-xl bg-neutral-900 hover:bg-neutral-800 border border-neutral-800 hover:border-white/30 transition-all active:scale-[0.98] group">
                    <div class="flex items-start gap-4">
                        <div class="w-6 h-6 rounded-full border-2 border-neutral-700 group-hover:border-white flex-shrink-0 flex items-center justify-center mt-0.5">
                            <div class="w-2.5 h-2.5 rounded-full bg-white opacity-0 group-hover:opacity-100 transition-opacity"></div>
                        </div>
                        <span class="text-lg text-neutral-300 group-hover:text-white leading-relaxed">
                            ${opt.text}
                        </span>
                    </div>
                </button>
            `).join('');

            appRoot.innerHTML = `
                <div class="p-6 flex flex-col h-screen animate-fade-in-up">
                    <div class="max-w-xl w-full mx-auto pt-8 flex-1 flex flex-col">
                        <!-- 進度條 -->
                        <div class="mb-8">
                            <div class="flex justify-between text-sm text-neutral-500 mb-2 font-bold">
                                <span>QUESTION ${currentQIndex + 1}</span>
                                <span>${currentQIndex + 1} / ${questions.length}</span>
                            </div>
                            <div class="h-2 bg-neutral-800 rounded-full overflow-hidden">
                                <div class="h-full bg-white transition-all duration-500 ease-out" style="width: ${progress}%"></div>
                            </div>
                        </div>

                        <!-- 題目 -->
                        <div class="mb-8 flex-1">
                            <h2 class="text-2xl md:text-3xl font-bold leading-relaxed mb-6">
                                ${currentQ.title}
                            </h2>
                            <div class="space-y-4">
                                ${optionsHTML}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderAnalyzing() {
            appRoot.innerHTML = `
                <div class="flex flex-col items-center justify-center p-6 h-screen">
                    <div class="text-center space-y-6">
                        <div class="relative w-24 h-24 mx-auto">
                            <div class="absolute inset-0 border-4 border-neutral-800 rounded-full"></div>
                            <div class="absolute inset-0 border-4 border-white rounded-full border-t-transparent animate-spin"></div>
                            <div class="absolute inset-0 m-auto flex items-center justify-center">
                                <i data-lucide="activity" class="text-white animate-pulse w-8 h-8"></i>
                            </div>
                        </div>
                        <h2 class="text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-zinc-300 to-white animate-pulse">
                            正在解碼你的籃球靈魂...
                        </h2>
                        <p class="text-neutral-500">分析戰術傾向與天賦特質</p>
                    </div>
                </div>
            `;
        }

        function renderResult() {
            const result = profiles[resultId];
            
            let imagesHTML = '';
            if (result.images && result.images.length > 0) {
                imagesHTML = `
                <div class="flex flex-wrap justify-center gap-4 md:gap-8 mb-8 relative z-10">
                    ${result.images.map((imgUrl, idx) => `
                        <div class="relative group">
                            <div class="absolute inset-0 bg-white opacity-0 group-hover:opacity-20 transition-all duration-300 rounded-2xl blur-xl group-hover:scale-110"></div>
                            <img 
                                src="${imgUrl}" 
                                alt="${result.title} 象徵球員 ${idx + 1}" 
                                class="w-40 h-40 md:w-52 md:h-52 object-cover rounded-2xl shadow-2xl transition-all duration-300 z-10 relative bg-neutral-900/50 group-hover:scale-105"
                                onerror="handleImageError(this)"
                            />
                        </div>
                    `).join('')}
                </div>`;
            } else {
                imagesHTML = generatePlayerAvatarSVG(result.colors);
            }

            appRoot.innerHTML = `
                <div class="pb-20 animate-fade-in-up">
                    <!-- 結果頭部區域 -->
                    <div class="relative pt-16 pb-8 px-6 text-center overflow-hidden">
                        <!-- 背景裝飾光暈 -->
                        <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[800px] h-[400px] opacity-10 blur-[100px] rounded-full pointer-events-none" style="background: ${result.colors[0]}"></div>
                        
                        <div class="relative z-10 max-w-2xl mx-auto">
                            <h3 class="text-zinc-400 font-bold tracking-widest text-sm mb-4">YOUR NBA SOUL</h3>
                            <h1 class="text-5xl md:text-6xl font-black mb-2 tracking-tight">${result.title}</h1>
                            <p class="text-xl text-neutral-400 font-medium mb-8">代表人物：${result.subtitle}</p>
                            
                            ${imagesHTML}

                            <div class="bg-neutral-900/80 backdrop-blur-md p-6 rounded-2xl border border-neutral-800 shadow-xl mb-12">
                                <p class="text-lg md:text-xl italic font-serif text-neutral-300 leading-relaxed mb-4">
                                    ${result.quote}
                                </p>
                                <div class="h-px w-16 bg-neutral-700 mx-auto"></div>
                            </div>
                        </div>
                    </div>

                    <!-- 數據與分析區域 -->
                    <div class="max-w-3xl mx-auto px-6 space-y-12">
                        
                        <!-- 雷達圖與能力值 -->
                        <div class="grid md:grid-cols-2 gap-8 items-center bg-neutral-900/30 p-8 rounded-3xl border border-neutral-800/50">
                            <div>
                                <h3 class="text-2xl font-bold mb-6 flex items-center gap-2">
                                    <i data-lucide="crosshair" class="text-white"></i> 能力解析
                                </h3>
                                ${generateRadarChartSVG(result.stats, result.colors[0])}
                            </div>
                            
                            <div class="space-y-6">
                                <h3 class="text-2xl font-bold mb-4 flex items-center gap-2">
                                    <i data-lucide="brain" class="text-white"></i> 靈魂分析
                                </h3>
                                <p class="text-neutral-300 leading-relaxed text-lg">
                                    ${result.desc}
                                </p>
                            </div>
                        </div>

                        <!-- 光譜量表 -->
                        <div class="bg-neutral-900/50 p-8 rounded-3xl border border-neutral-800/50 space-y-8">
                            <h3 class="text-2xl font-bold mb-6 flex items-center gap-2">
                                <i data-lucide="activity" class="text-white"></i> 風格光譜
                            </h3>
                            
                            <!-- Playstyle Spectrum -->
                            <div>
                                <div class="flex justify-between text-sm font-bold text-neutral-400 mb-3">
                                    <span>地板流 (技巧/節奏)</span>
                                    <span>天空流 (體能/滯空)</span>
                                </div>
                                <div class="h-4 bg-neutral-800 rounded-full relative overflow-hidden shadow-inner">
                                    <div class="absolute top-0 left-0 h-full rounded-full transition-all duration-1000" style="width: ${result.spectrum.playstyle}%; background: linear-gradient(90deg, #27272A, #FFFFFF)"></div>
                                    <div class="absolute top-1/2 -translate-y-1/2 w-6 h-6 bg-black rounded-full shadow-md border-4 transition-all duration-1000" style="left: calc(${result.spectrum.playstyle}% - 12px); border-color: #FFFFFF"></div>
                                </div>
                            </div>

                            <!-- Mentality Spectrum -->
                            <div>
                                <div class="flex justify-between text-sm font-bold text-neutral-400 mb-3">
                                    <span>孤狼意志 (Hero Ball)</span>
                                    <span>團隊至上 (System)</span>
                                </div>
                                <div class="h-4 bg-neutral-800 rounded-full relative overflow-hidden shadow-inner">
                                    <div class="absolute top-0 left-0 h-full rounded-full transition-all duration-1000 delay-300" style="width: ${result.spectrum.mentality}%; background: linear-gradient(90deg, #27272A, #FFFFFF)"></div>
                                    <div class="absolute top-1/2 -translate-y-1/2 w-6 h-6 bg-black rounded-full shadow-md border-4 transition-all duration-1000 delay-300" style="left: calc(${result.spectrum.mentality}% - 12px); border-color: #FFFFFF"></div>
                                </div>
                            </div>
                        </div>

                        <!-- 重新測驗按鈕 -->
                        <div class="pt-8 text-center">
                            <button onclick="resetTest()" class="inline-flex items-center gap-2 px-8 py-4 bg-white hover:bg-zinc-200 text-black font-bold rounded-xl transition-all active:scale-95">
                                <i data-lucide="rotate-ccw"></i>
                                重新測試
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        // --- 互動邏輯區 ---

        function initScores() {
            scores = {};
            Object.keys(profiles).forEach(key => scores[key] = 0);
        }

        function handleStart() {
            stage = 'playing';
            updateUI();
        }

        function handleAnswer(qIndex, optIndex) {
            const impact = questions[qIndex].options[optIndex].impact;
            
            // 計算分數
            Object.keys(impact).forEach(key => {
                if (scores[key] !== undefined) {
                    scores[key] += impact[key];
                }
            });

            // 稍微延遲讓使用者看到點擊按鈕的回饋
            setTimeout(() => {
                if (currentQIndex < questions.length - 1) {
                    currentQIndex++;
                    updateUI();
                } else {
                    calculateResult();
                }
            }, 300);
        }

        function calculateResult() {
            stage = 'analyzing';
            updateUI();
            
            // 找出最高分的角色
            let maxScore = -1;
            let winner = 'system'; // 預設值
            
            Object.keys(scores).forEach(key => {
                if (scores[key] > maxScore) {
                    maxScore = scores[key];
                    winner = key;
                }
            });
            
            resultId = winner;

            // 假裝分析中，2秒後顯示結果
            setTimeout(() => {
                stage = 'result';
                updateUI();
            }, 2000);
        }

        function resetTest() {
            initScores();
            currentQIndex = 0;
            resultId = null;
            stage = 'start';
            updateUI();
            window.scrollTo(0, 0);
        }

        // --- 初始化啟動 ---
        initAnimatedBackground();
        initScores();
        updateUI();

    </script>
</body>
</html>
